name: Bug report
description: Report a reproducible problem in a Lithium project.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private keys, credentials, seed phrases, or unpatched security vulnerabilities.
  - type: input
    id: repository
    attributes:
      label: Repository or component
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include network, browser, wallet, operating system, and commit or release details.

